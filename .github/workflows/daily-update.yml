name: Daily README Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update last-refreshed date
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          sed -i "s#<!--LAST_UPDATED-->.*<!--END_LAST_UPDATED-->#<!--LAST_UPDATED-->${TODAY}<!--END_LAST_UPDATED-->#" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: daily README refresh"
          git push
